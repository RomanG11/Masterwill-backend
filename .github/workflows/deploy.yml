name: Deploy backend to EC2

# Builds the Docker image, pushes it to Amazon ECR, then has
# masterwill-backend-server pull and run the new image. The instance has
# no IAM instance profile, so it can't fetch its own ECR credentials — the
# runner gets a short-lived ECR password (aws ecr get-login-password) and
# hands it to the server's `docker login` over SSH instead.
#
# One-time setup this workflow expects:
#
# 1. Docker installed and running on masterwill-backend-server:
#      sudo dnf install -y docker
#      sudo systemctl enable --now docker
#
# 2. /opt/masterwill-backend/.env on the server, with real values for
#    DATABASE_URL (the masterwill-prod RDS instance), JWT_SECRET, etc.:
#      sudo mkdir -p /opt/masterwill-backend
#      sudo touch /opt/masterwill-backend/.env
#    This workflow never overwrites that file, so secrets persist across
#    deploys.
#
# 3. Repo secrets (Settings > Secrets and variables > Actions):
#      AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
#        an IAM user scoped to ecr:GetAuthorizationToken (Resource: *) and
#        ecr:BatchCheckLayerAvailability / GetDownloadUrlForLayer /
#        BatchGetImage / PutImage / InitiateLayerUpload / UploadLayerPart /
#        CompleteLayerUpload on
#        arn:aws:ecr:eu-central-1:641699364994:repository/masterwill-backend
#      EC2_HOST      e.g. 52.29.183.7 (or a stable DNS name for the instance)
#      EC2_USER      ec2-user
#      EC2_SSH_KEY   base64 of the private key this instance was launched with —
#                    NOT the raw PEM text. Pasting a multi-line PEM directly into
#                    a GitHub secret is exactly what caused the
#                    "Load key ...: error in libcrypto" failure: GitHub (or
#                    whatever clipboard step touched it on the way) mangled the
#                    line breaks. Base64 collapses it to one line first, so
#                    there's nothing left to mangle. Generate it with:
#                      base64 -w0 path/to/MainKeyPair.pem            # Linux
#                      base64 -i path/to/MainKeyPair.pem | tr -d '\n' # macOS
#                    PowerShell:
#                      [Convert]::ToBase64String([IO.File]::ReadAllBytes("MainKeyPair.pem"))
#                    The key must have no passphrase — nothing in this
#                    non-interactive job can supply one.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: masterwill-backend

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Fail here with a clear message instead of a confusing
          # "Permission denied" from ssh later, if EC2_SSH_KEY wasn't
          # actually base64 (or decoded to something that isn't a key).
          ssh-keygen -y -f ~/.ssh/deploy_key -P '' > /dev/null
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull and run the new image on masterwill-backend-server
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"

          cat > remote-deploy.sh <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          echo "$ECR_PASSWORD" | sudo docker login --username AWS --password-stdin "$REGISTRY"
          sudo docker pull "$IMAGE"
          sudo docker stop masterwill-backend >/dev/null 2>&1 || true
          sudo docker rm masterwill-backend >/dev/null 2>&1 || true
          sudo mkdir -p /opt/masterwill-backend
          sudo touch /opt/masterwill-backend/.env
          sudo docker run -d --name masterwill-backend --restart unless-stopped \
            --env-file /opt/masterwill-backend/.env -p 80:8080 "$IMAGE"
          sudo docker image prune -f
          EOF
          chmod 600 remote-deploy.sh

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -s' < remote-deploy.sh

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key remote-deploy.sh
