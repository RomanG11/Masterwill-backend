services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: masterwill
      POSTGRES_PASSWORD: masterwill_dev_pw
      POSTGRES_DB: masterwill
    ports:
      - "5432:5432"
    volumes:
      - masterwill-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterwill -d masterwill"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  masterwill-db-data:
